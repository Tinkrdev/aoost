<style>
/* Layout: one sheet of paper — projects (a table of loose work), playlist, and the wall, a pocket Photoshop in dark editor chrome. Ballpoint blue marks the page; sticky notes are the only other colour that isn't the art. */
:root{
  --paper:#EFF0EC;
  --paper-2:#E4E6E0;
  --white:#FBFBF8;
  --ink:#141516;
  --ink-2:#56595C;
  --rule:#C9CCC5;
  --blue:#2236F2;
  --blue-soft:rgba(34,54,242,.12);
  --note:#F2E36B;
  --neon:#FF2D95;
  --lime:#86E06F;--pink:#D9559E;--orange:#F1A23B;--sky:#7FA9E6;
  --ui:#1D1D1F;--ui-0:#151517;--ui-2:#2A2A2D;--ui-3:#333337;--ui-line:#3A3A3E;--ui-text:#D6D6D8;--ui-dim:#8C8C92;--ui-sel:#2F6BFF;
  --display:"Lexend","Facile Sans",ui-sans-serif,system-ui,sans-serif; /* swap Lexend for Facile Sans once self-hosted */
  --body:"Lexend",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:72px;--s9:104px;
  --t-xs:11px;--t-sm:13px;--t-md:16px;--t-lg:22px;--t-xl:clamp(34px,8vw,56px);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:300;font-size:var(--t-md);line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s9);padding-block:var(--s5) var(--s8)}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:2px}
.label{font-family:var(--mono);font-size:var(--t-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:400}

/* top: strip, name, projects sit at equal gaps so the name is centred between them */
.who{margin:0;font-family:var(--mono);font-size:clamp(15px,4.4vw,22px);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:400}
.strip{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);border-bottom:1px solid var(--rule);padding-bottom:var(--s3)}
.strip .clock{font-variant-numeric:tabular-nums}

/* sticky notes on the page (your designs, 600 × 600) */
.sticky{position:absolute;width:var(--w,104px);aspect-ratio:1/1;background:var(--note);transform:rotate(var(--r,4deg));box-shadow:0 1px 0 rgba(20,21,22,.06),0 10px 18px -12px rgba(20,21,22,.35);z-index:2;pointer-events:none}
.sticky img,.sticky canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.sticky.table-note{right:-6px;top:-34px;--w:clamp(74px,20vw,112px);--r:-7deg;z-index:60;background:var(--neon)}

/* section heads */
section{position:relative;display:flex;flex-direction:column;gap:var(--s5)}
.head h2{position:relative;display:inline-block;margin:0;font-family:var(--display);font-weight:400;font-size:var(--t-xl);letter-spacing:-.04em;line-height:1}
.head h2 svg{position:absolute;left:-4%;bottom:-.32em;width:108%;height:.5em;overflow:visible;pointer-events:none}
.ink-path{fill:none;stroke:var(--blue);stroke-linecap:round;stroke-linejoin:round}
.draw .ink-path{transition:stroke-dashoffset 1.1s cubic-bezier(.6,.1,.2,1)}
.btn{font-family:var(--mono);font-size:var(--t-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:10px 14px;min-height:40px;cursor:pointer;border-radius:999px;transition:background .15s,color .15s}
.btn:hover{background:var(--ink);color:var(--paper)}

/* projects table */
.table-wrap{position:relative;margin-top:var(--s2)}
.table{position:relative;min-height:clamp(560px,120vw,640px);background:var(--paper-2);overflow:hidden;border-radius:2px}
.table::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:32px 32px;opacity:.45;pointer-events:none}
.piece{position:absolute;left:0;top:0;background:var(--white);padding:6px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;will-change:transform;transition:box-shadow .2s;box-shadow:0 1px 0 rgba(20,21,22,.08)}
.piece img,.piece canvas{display:block;width:100%;height:auto;max-width:100%;pointer-events:none;-webkit-user-drag:none}
.piece.lifted{cursor:grabbing;box-shadow:0 18px 30px -12px rgba(20,21,22,.35)}
.piece .tape{position:absolute;top:-8px;left:50%;width:42%;max-width:46px;height:15px;transform:translateX(-50%) rotate(-3deg);background:var(--blue-soft);border:1px solid rgba(34,54,242,.18)}
.add-art{display:none;align-self:flex-start}
.editing .add-art{display:inline-flex}

/* zoom viewer */
.viewer{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:rgba(20,21,22,.9);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:var(--s3)}
.viewer .vbar{display:flex;justify-content:flex-end}
.viewer .vclose{color:#fff;border-color:rgba(255,255,255,.6)}
.viewer .vclose:hover{background:#fff;color:var(--ink)}
.viewer .stage{flex:1;min-height:0;display:grid;place-items:center}
.viewer .stage img,.viewer .stage canvas{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:var(--white);animation:zoom .3s cubic-bezier(.2,.8,.2,1)}
@keyframes zoom{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}

/* playlist */
/* the band: a dark editor workspace, full bleed, with rulers and guides */
.band{position:relative;margin-inline:calc(50% - 50vw);background:#2B2B2E;color:#fff;overflow:hidden;gap:0}
.band-in{position:relative;z-index:2;width:100%;min-width:0;max-width:1106px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:var(--s6);
  padding-block:calc(18px + var(--s7)) var(--s7);padding-left:max(calc(18px + 24px),calc(env(safe-area-inset-left,0px) + 18px + 16px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (min-width:1100px){.band-in{padding-left:calc(18px + 24px);padding-right:24px}}
.band .head h2{color:#fff}
.band .ink-path{stroke:#5B86FF}
.ruler-x{position:absolute;left:0;right:0;top:0;height:18px;background:#1D1D1F;border-bottom:1px solid #3A3A3E;z-index:3;
  background-image:repeating-linear-gradient(90deg,#5a5a60 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,#6a6a70 0 1px,transparent 1px 100px);background-size:100% 5px,100% 10px;background-repeat:repeat-x;background-position:18px 13px,18px 8px}
.ruler-x span{position:absolute;top:0;font:400 8px/18px var(--mono);color:#8C8C92;padding-left:3px;font-variant-numeric:tabular-nums}
.ruler-y{position:absolute;left:0;top:18px;bottom:0;width:18px;background:#1D1D1F;border-right:1px solid #3A3A3E;z-index:3;
  background-image:repeating-linear-gradient(180deg,#5a5a60 0 1px,transparent 1px 10px),repeating-linear-gradient(180deg,#6a6a70 0 1px,transparent 1px 100px);background-size:5px 100%,10px 100%;background-repeat:repeat-y;background-position:13px 0,8px 0}
.ruler-corner{position:absolute;left:0;top:0;width:18px;height:18px;background:#1D1D1F;border-right:1px solid #3A3A3E;border-bottom:1px solid #3A3A3E;z-index:4}
.guide-v,.guide-h{position:absolute;z-index:1;background:rgba(0,229,255,.55);pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.guide-v{top:18px;bottom:0;left:0;width:1px}
.guide-h{left:18px;right:0;top:0;height:1px}
.discs{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:min(66vw,300px);gap:var(--s4);overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:8px;padding:8px 8px 34px;margin:-8px -24px -34px -8px;scrollbar-width:none}
.discs::-webkit-scrollbar{display:none}
@media (min-width:1000px){.discs{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-columns:auto;overflow:visible;margin-right:-8px}}
.disc-wrap{position:relative;scroll-snap-align:start}
.disc{position:relative;display:block;width:100%;aspect-ratio:1/1;border:0;padding:0;cursor:pointer;background:var(--ink);overflow:hidden;text-align:left;color:#fff;font:inherit;opacity:.82;transition:opacity .2s}
.disc[aria-pressed="true"],.disc:hover{opacity:1}
.disc img,.disc canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.disc .over{position:absolute;inset:0;display:flex;align-items:flex-end;padding:var(--s4);background:linear-gradient(to top,rgba(20,21,22,.66),rgba(20,21,22,0) 42%)}
.disc .t{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,40px);letter-spacing:-.04em;line-height:1}
.disc:focus-visible{outline:2px solid #5B86FF;outline-offset:8px}
/* Photoshop transform box on the selected card */
.tbox{position:absolute;inset:-5px;border:1px solid var(--ui-sel);pointer-events:none;animation:tbox .25s ease-out}
.tbox i{position:absolute;width:7px;height:7px;background:#fff;border:1px solid var(--ui-sel);box-sizing:border-box}
.tbox i:nth-child(1){left:-4px;top:-4px}.tbox i:nth-child(2){left:calc(50% - 4px);top:-4px}.tbox i:nth-child(3){right:-4px;top:-4px}
.tbox i:nth-child(4){left:-4px;top:calc(50% - 4px)}.tbox i:nth-child(5){right:-4px;top:calc(50% - 4px)}
.tbox i:nth-child(6){left:-4px;bottom:-4px}.tbox i:nth-child(7){left:calc(50% - 4px);bottom:-4px}.tbox i:nth-child(8){right:-4px;bottom:-4px}
.tbox b{position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);background:var(--ui-sel);color:#fff;font:400 10px/1 var(--mono);padding:4px 6px;border-radius:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
@keyframes tbox{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
/* media widget (Alex's widget set) */
.mw{display:flex;gap:clamp(14px,4vw,22px);width:100%;max-width:560px;background:#000;color:#fff;border-radius:28px;padding:clamp(16px,4.5vw,22px) clamp(16px,4.5vw,26px)}
.mw-art{position:relative;flex:none;width:clamp(68px,19vw,150px);aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#1a1a1a;align-self:center}
.mw-art img,.mw-art canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mw-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.mw-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mw-t{font:500 clamp(18px,5vw,22px)/1.1 Manrope,var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-a{font:400 13px/1.2 Manrope,var(--body);color:#8a8a8a;margin-top:5px;white-space:nowrap}
.mw-dot{color:var(--ac)}
.mw-open{flex:none;display:grid;place-items:center;width:32px;height:32px;margin:-4px -6px 0 0;color:#8a8a8a;border-radius:50%}
.mw-open:hover{color:#fff}
.mw-open svg{width:18px;height:18px}
.mw-wave{height:26px;cursor:pointer;touch-action:none;border-radius:4px}
.mw-wave svg{display:block}
.mw-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mw-time{font:400 11px/1 "IBM Plex Mono",var(--mono);color:#8a8a8a;font-variant-numeric:tabular-nums;white-space:nowrap}
.mw-ctl{display:flex;align-items:center;margin-right:-6px}
.mw-b{width:36px;height:36px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.mw-b svg{width:20px;height:20px}
.mw-play{width:44px;height:44px;border-radius:50%;background:var(--ac);display:grid;place-items:center;border:0;padding:0;cursor:pointer;transition:transform .15s}
.mw-play:active{transform:scale(.94)}
.mw-play svg{width:18px;height:18px}
@media (max-width:420px){.mw{padding:16px;gap:14px;border-radius:24px}.mw-b{width:32px;height:32px}.mw-b svg{width:18px;height:18px}.mw-play{width:40px;height:40px}.mw-t{font-size:18px}}
.sp-host{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;left:0;bottom:0}

/* ---------- the wall: a pocket Photoshop ---------- */
.ps{position:relative;width:100%;max-width:900px;margin:0 auto;background:var(--ui);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:10px;font-family:var(--mono);font-size:var(--t-xs);box-shadow:0 30px 60px -30px rgba(20,21,22,.55)}
.ps button{font-family:var(--mono)}
.menubar{display:flex;align-items:center;gap:2px;height:32px;padding:0 6px;border-bottom:1px solid var(--ui-line);background:var(--ui-0);border-radius:10px 10px 0 0}
.menubar .dots{display:flex;gap:6px;padding:0 8px 0 4px}
.menubar .dots i{width:10px;height:10px;border-radius:50%;background:var(--ui-3)}
.menu{position:relative}
.menu > button{height:26px;padding:0 9px;border:0;border-radius:5px;background:transparent;color:var(--ui-text);font-size:var(--t-xs);cursor:pointer}
.menu > button[aria-expanded="true"],.menu > button:hover{background:var(--ui-3);color:#fff}
.menu ul{position:absolute;left:0;top:30px;z-index:40;min-width:208px;list-style:none;margin:0;padding:4px;background:var(--ui-2);border:1px solid var(--ui-line);border-radius:7px;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
.menu li button{display:flex;justify-content:space-between;gap:16px;width:100%;padding:7px 9px;border:0;border-radius:4px;background:transparent;color:var(--ui-text);font-size:var(--t-xs);text-align:left;cursor:pointer}
.menu li button:hover,.menu li button:focus-visible{background:var(--ui-sel);color:#fff;outline:0}
.menu li button span{color:var(--ui-dim)}
.menu li button:hover span{color:rgba(255,255,255,.75)}
.menu li hr{border:0;border-top:1px solid var(--ui-line);margin:4px 2px}
.menu li button[aria-checked="true"]::before{content:"✓";margin-right:-8px}
.optbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:40px;padding:6px 10px;border-bottom:1px solid var(--ui-line)}
.optbar .cur{display:flex;align-items:center;gap:6px;color:#fff;min-width:74px}
.optbar .cur svg{width:16px;height:16px}
.opt{display:flex;align-items:center;gap:8px;color:var(--ui-dim)}
.opt input[type=range]{width:96px;accent-color:var(--ui-sel)}
.opt output{min-width:38px;color:var(--ui-text);font-variant-numeric:tabular-nums}
.opt[hidden]{display:none!important}
.notecols{display:flex;gap:6px}
.notecols button,.sw{width:20px;height:20px;border-radius:3px;border:1px solid var(--ui-line);background:var(--c);cursor:pointer;padding:0}
.notecols button[aria-pressed="true"],.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ui),0 0 0 3px #fff}
.docbar{display:flex;align-items:flex-end;height:30px;padding:0 6px;background:var(--ui-0);border-bottom:1px solid var(--ui-line)}
.doctab{display:flex;gap:8px;align-items:center;height:26px;padding:0 10px;background:var(--ui);border:1px solid var(--ui-line);border-bottom:0;border-radius:5px 5px 0 0;white-space:nowrap;overflow:hidden;min-width:0}
.doctab b{font-weight:500;color:#fff}
.doctab span{color:var(--ui-dim);overflow:hidden;text-overflow:ellipsis}
.work{display:grid;grid-template-columns:1fr;min-height:0}
.toolbar{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:2px;padding:6px;border-bottom:1px solid var(--ui-line)}
.toolbar::-webkit-scrollbar{display:none}
.tool{position:relative;flex:none;display:grid;place-items:center;width:40px;height:38px;border:0;border-radius:6px;background:transparent;color:var(--ui-text);cursor:pointer}
.tool svg{width:19px;height:19px}
.tool:hover{background:var(--ui-2)}
.tool[aria-pressed="true"]{background:var(--ui-3);color:#fff;box-shadow:inset 0 0 0 1px var(--ui-line)}
.tool .k{position:absolute;right:3px;bottom:1px;font-size:8px;color:var(--ui-dim)}
.toolbar .sep{flex:none;width:1px;height:24px;background:var(--ui-line);margin:0 4px}
.fgbg{position:relative;flex:none;width:40px;height:38px;margin-left:2px}
.fgbg .fg,.fgbg .bgc{position:absolute;width:20px;height:20px;border:1px solid #fff;box-shadow:0 0 0 1px var(--ui-0)}
.fgbg .fg{left:6px;top:4px;z-index:1;background:var(--fg);cursor:pointer;padding:0}
.fgbg .bgc{left:15px;top:13px;background:#fff}
.palette{display:flex;gap:6px;align-items:center;padding:0 6px}
.canvasarea{position:relative;background:#2B2B2E;background-image:linear-gradient(45deg,#2F2F33 25%,transparent 25%),linear-gradient(-45deg,#2F2F33 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2F2F33 75%),linear-gradient(-45deg,transparent 75%,#2F2F33 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;padding:14px;display:grid;place-items:center;min-width:0}
.board{position:relative;width:100%;max-width:540px;aspect-ratio:4/5;background:var(--white);overflow:hidden;touch-action:none;box-shadow:0 8px 24px -8px rgba(0,0,0,.6)}
.board canvas.bg,.board canvas.paint{position:absolute;inset:0;width:100%;height:100%}
.board canvas.paint{z-index:3;cursor:crosshair}
.board.move canvas.paint,.board.note canvas.paint{pointer-events:none}
.board.note{cursor:copy}
.stk-layer{position:absolute;inset:0;z-index:2}
.stk{position:absolute;left:0;top:0;width:24%;aspect-ratio:1/1;transform-origin:50% 50%;touch-action:none;pointer-events:none}
.stk canvas{width:100%;height:100%;display:block;box-shadow:0 8px 14px -10px rgba(20,21,22,.5)}
.board.move .stk{pointer-events:auto;cursor:move}
.stk.sel{outline:1px solid var(--ui-sel);outline-offset:2px}
.stk.sel::after{content:"";position:absolute;inset:-6px;background:
  linear-gradient(#fff,#fff) 0 0/7px 7px no-repeat,linear-gradient(#fff,#fff) 100% 0/7px 7px no-repeat,linear-gradient(#fff,#fff) 0 100%/7px 7px no-repeat,linear-gradient(#fff,#fff) 100% 100%/7px 7px no-repeat;pointer-events:none;filter:drop-shadow(0 0 0 var(--ui-sel)) drop-shadow(0 0 1px var(--ui-sel))}
.panels{border-top:1px solid var(--ui-line);display:grid;grid-template-columns:1fr;min-width:0}
.panel{display:flex;flex-direction:column;min-width:0}
.panel + .panel{border-top:1px solid var(--ui-line)}
.panel h4{margin:0;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-weight:500;font-size:var(--t-xs);color:#fff;background:var(--ui-0);letter-spacing:.04em}
.panel h4 span{color:var(--ui-dim);font-weight:400}
.layers{list-style:none;margin:0;padding:4px}
.layers li{display:grid;grid-template-columns:28px 34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 6px;border-radius:5px}
.layers li.cur{background:rgba(47,107,255,.22)}
.layers .eye{display:grid;place-items:center;width:28px;height:28px;border:0;background:transparent;color:var(--ui-text);cursor:pointer;border-radius:4px}
.layers .eye[aria-pressed="false"]{color:var(--ui-dim)}
.layers .eye svg{width:15px;height:15px}
.layers .th{width:34px;height:26px;border:1px solid var(--ui-line);overflow:hidden;background:#fff}
.layers .th canvas{width:100%;height:100%;display:block}
.layers .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layers .ct{color:var(--ui-dim);font-variant-numeric:tabular-nums}
.bgs{display:flex;gap:8px;padding:8px 10px 10px;overflow-x:auto;scrollbar-width:none}
.bgs::-webkit-scrollbar{display:none}
.bgs{flex-wrap:wrap;overflow:visible}
.bgs button,.bgs .pick{position:relative;flex:none;width:30px;height:30px;padding:0;border:1px solid var(--ui-line);border-radius:4px;background:var(--c);cursor:pointer}
.bgs button[aria-pressed="true"],.bgs .pick.on{box-shadow:0 0 0 2px var(--ui),0 0 0 3px #fff}
.bgs .pick{display:grid;place-items:center;background:conic-gradient(#ff2d95,#f1a23b,#f2e36b,#86e06f,#7fa9e6,#2236f2,#ff2d95);overflow:hidden}
.bgs .pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.bgs .pick span{color:#fff;font:500 14px/1 var(--mono);text-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:none}
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 10px;border-top:1px solid var(--ui-line);background:var(--ui-0);border-radius:0 0 10px 10px;color:var(--ui-dim)}
.statusbar .left{display:flex;gap:14px;font-variant-numeric:tabular-nums;min-width:0}
.ui-btn{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ui-text);background:var(--ui-2);border:1px solid var(--ui-line);padding:8px 11px;border-radius:6px;cursor:pointer;min-height:34px}
.ui-btn:hover{color:#fff;border-color:var(--ui-dim)}
.ui-btn.primary{background:var(--ui-sel);border-color:var(--ui-sel);color:#fff}
.ui-btn[disabled]{opacity:.4;cursor:default}
.ps-toast{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);z-index:30;background:var(--ui-0);color:#fff;border:1px solid var(--ui-line);padding:7px 11px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.ps-toast.show{opacity:1}
@media (min-width:760px){
  .work{grid-template-columns:52px minmax(0,1fr) 230px}
  .toolbar{flex-direction:column;border-bottom:0;border-right:1px solid var(--ui-line);padding:8px 6px;overflow:visible}
  .toolbar .sep{width:24px;height:1px;margin:4px 0}
  .palette{flex-direction:column;padding:6px 0}
  .panels{border-top:0;border-left:1px solid var(--ui-line);align-content:start}
  .canvasarea{padding:28px}
}

footer{position:relative;display:flex;justify-content:flex-end;border-top:1px solid var(--rule);padding-top:var(--s3);margin-top:var(--s6)}

/* artwork reel */
.reel{margin-top:calc(var(--s5) - var(--s9));margin-inline:calc(50% - 50vw)}
.reel-track{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;height:clamp(190px,52vw,300px);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));cursor:grab;-webkit-user-select:none;user-select:none}
.reel-track::-webkit-scrollbar{display:none}
.reel-track.dragging{cursor:grabbing}
.reel-item{flex:none;height:100%;border:0;padding:6px;background:var(--white);cursor:zoom-in;box-shadow:0 1px 0 rgba(20,21,22,.08);box-sizing:border-box}
.reel-item img,.reel-item canvas{height:100%;width:auto;max-width:none;display:block;pointer-events:none;-webkit-user-drag:none}

/* western line art */
.doodle{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.who-row{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4)}
.who-row .cactus{flex:none;width:clamp(38px,10vw,58px);height:auto;aspect-ratio:60/100;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.head{position:relative}
.head .skull{position:absolute;right:0;bottom:0;width:clamp(56px,15vw,84px);height:auto;aspect-ratio:100/72}
.tumble{position:absolute;left:calc(50% - 50vw);top:-46px;width:100vw;height:44px;pointer-events:none;overflow:hidden}
.tumble svg{position:absolute;left:0;bottom:0;width:36px;height:36px;animation:tumble 26s linear infinite}
.tumble svg path{animation:spin 1.6s linear infinite;transform-origin:20px 20px;transform-box:view-box}
@keyframes tumble{0%{transform:translate(-50px,0)}6%{transform:translate(calc(.15 * 100vw),-10px)}12%{transform:translate(calc(.3 * 100vw),0)}18%{transform:translate(calc(.45 * 100vw),-7px)}24%{transform:translate(calc(.6 * 100vw),0)}30%{transform:translate(calc(.75 * 100vw),-5px)}38%,100%{transform:translate(calc(100vw + 50px),0)}}
@keyframes spin{to{transform:rotate(360deg)}}
footer .scorp{position:absolute;bottom:100%;left:0;width:56px;height:auto;aspect-ratio:120/70;margin-bottom:-6px;animation:crawl 46s linear infinite}
footer .scorp .legs{animation:scuttle .22s ease-in-out infinite alternate;transform-origin:64px 44px;transform-box:view-box}
@keyframes crawl{0%{left:0;transform:scaleX(1)}46%{left:calc(100% - 56px);transform:scaleX(1)}50%{left:calc(100% - 56px);transform:scaleX(-1)}96%{left:0;transform:scaleX(-1)}100%{left:0;transform:scaleX(1)}}
@keyframes scuttle{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

/* rodeo */
.rodeo{position:relative;background:var(--white);box-shadow:0 0 0 1px var(--rule)}
.rodeo canvas{display:block;width:100%;height:clamp(200px,52vw,260px);touch-action:manipulation;cursor:pointer}
.rodeo canvas:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.who-row .cactus,.tumble svg,.tumble svg path,footer .scorp,footer .scorp .legs{animation:none}.tumble{display:none}}
@media (prefers-reduced-motion:reduce){.draw .ink-path{transition:none}.viewer .stage img,.viewer .stage canvas{animation:none}.mw-play{transition:none}.guide-v,.guide-h{transition:none}.tbox{animation:none}.disc{transition:none}.ps-toast{transition:none}}
</style>

const cs=getComputedStyle(document.documentElement), tok=n=>cs.getPropertyValue('--'+n).trim();
const C={blue:tok('blue')||'#2236F2',ink:tok('ink')||'#141516',paper:'#FBFBF8',note:tok('note')||'#F2E36B',lime:tok('lime')||'#86E06F',pink:tok('pink')||'#D9559E',orange:tok('orange')||'#F1A23B',sky:tok('sky')||'#7FA9E6',white:'#FFFFFF'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const IN_CLAUDE = typeof window.claude === 'object' && window.claude !== null; // false on your own host
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%1e9)/1e9;};}
function noise2(seed){const r=rng(seed),p=Array.from({length:256},r),h=(x,y)=>p[(x*73856093^y*19349663)&255],sm=t=>t*t*(3-2*t);
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),d=h(xi+1,yi+1),u=sm(xf),v=sm(yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fit(cv){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return[c,r.width,r.height];}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.decoding='async';i.onload=()=>res(i);i.onerror=rej;i.src=src;});}

/* ---------- hand-drawn underlines ---------- */
function smooth(pts){let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=` Q${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;}const l=pts[pts.length-1];return d+` L${l[0].toFixed(1)} ${l[1].toFixed(1)}`;}
function linePts(r){const pts=[],n=14;for(let i=0;i<=n;i++)pts.push([i/n*100,50+(r()-.5)*24+Math.sin(i/n*Math.PI)*-8]);const back=[];for(let i=n;i>=n*.35;i--)back.push([i/n*100-2,70+(r()-.5)*18]);return[pts,back];}
document.querySelectorAll('[data-underline]').forEach((h,i)=>{const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');
  linePts(rng(31+i*17)).forEach(pts=>{const p=document.createElementNS(ns,'path');p.setAttribute('d',smooth(pts));p.setAttribute('class','ink-path');p.setAttribute('stroke-width',1.6);p.setAttribute('vector-effect','non-scaling-stroke');svg.appendChild(p);});h.appendChild(svg);
  const paths=[...svg.querySelectorAll('path')];paths.forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=reduce?0:L;});

function redrawPaint(){pctx.clearRect(0,0,OUT_W,OUT_H);strokes.forEach(s=>commit(pctx,s));renderLayers();}
function showLive(){pctx.clearRect(0,0,OUT_W,OUT_H);pctx.drawImage(base,0,0);commit(pctx,cur);}
paintC.addEventListener('pointerdown',e=>{if(!['brush','spray','marker','eraser'].includes(tool))return;if(!vis.paint){vis.paint=true;paintC.style.visibility='';}
  paintC.setPointerCapture(e.pointerId);cur={tool,color,size,op:opacity,seed:(Math.random()*1e9)|0,pts:[toOut(e)]};
  base=document.createElement('canvas');base.width=OUT_W;base.height=OUT_H;base.getContext('2d').drawImage(paintC,0,0);showLive();});
let raf=0;paintC.addEventListener('pointermove',e=>{const p0=toOut(e);document.getElementById('xy').textContent=`x ${Math.round(p0.x)} y ${Math.round(p0.y)}`;if(!cur)return;
  (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=toOut(ev),l=cur.pts[cur.pts.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)>=1.5)cur.pts.push(p);});
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(cur)showLive();});});
const endStroke=()=>{if(!cur)return;cancelAnimationFrame(raf);raf=0;showLive();strokes.push(cur);cur=null;base=null;renderLayers();};
paintC.addEventListener('pointerup',endStroke);paintC.addEventListener('pointercancel',endStroke);
function undo(){if(!strokes.length){toast('Nothing to undo');return;}strokes.pop();redrawPaint();toast('Undo stroke');}

/* sticky notes on the wall (blank — draw or write on them) */
function placeNote(n){const k=board.clientWidth/OUT_W;n.el.style.transform=`translate(${n.x*k}px,${n.y*k}px) rotate(${n.rot}deg)`;}
function selectNote(n){selNote=n;notes.forEach(x=>x.el.classList.toggle('sel',x===n));}
function addNote(x,y){const el=document.createElement('div');el.className='stk';const cv=document.createElement('canvas');cv.width=300;cv.height=300;paintNote(cv.getContext('2d'),300,300,C[noteCol]);el.appendChild(cv);stkLayer.appendChild(el);
  const n={el,cv,col:noteCol,x:(x??OUT_W*(.38+Math.random()*.1))-NOTE_W/2,y:(y??OUT_H*(.4+Math.random()*.1))-NOTE_W/2,rot:(Math.random()-.5)*12};notes.push(n);placeNote(n);vis.notes=true;stkLayer.style.visibility='';
  let sx,sy,ox,oy,id=null;
  el.addEventListener('pointerdown',e=>{if(tool!=='move')return;id=e.pointerId;el.setPointerCapture(id);sx=e.clientX;sy=e.clientY;ox=n.x;oy=n.y;selectNote(n);stkLayer.appendChild(el);notes.push(notes.splice(notes.indexOf(n),1)[0]);e.stopPropagation();});
  el.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const k=OUT_W/board.clientWidth;n.x=Math.max(-NOTE_W*.5,Math.min(OUT_W-NOTE_W*.5,ox+(e.clientX-sx)*k));n.y=Math.max(-NOTE_W*.5,Math.min(OUT_H-NOTE_W*.5,oy+(e.clientY-sy)*k));placeNote(n);document.getElementById('xy').textContent=`x ${Math.round(n.x)} y ${Math.round(n.y)}`;});
  const up=()=>{id=null;};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);renderLayers();return n;}
function delNote(){if(!selNote){toast('Select a note with the Move tool');return;}selNote.el.remove();notes.splice(notes.indexOf(selNote),1);selNote=null;renderLayers();toast('Note deleted');}
board.addEventListener('pointerdown',e=>{if(tool==='note'){const r=board.getBoundingClientRect(),k=OUT_W/r.width;addNote((e.clientX-r.left)*k,(e.clientY-r.top)*k);toast('Note added. Draw on it, or V to move it');}
  else if(tool==='move'&&!e.target.closest('.stk'))selectNote(null);});

/* layers panel */
const eye='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const eyeOff='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4"/><path d="M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/></svg>';
const layersEl=document.getElementById('layers');
function renderLayers(){const rows=[{k:'paint',nm:'Paint',ct:strokes.length+(strokes.length===1?' stroke':' strokes'),th:c=>{c.fillStyle='#fff';c.fillRect(0,0,68,52);c.drawImage(paintC,0,0,68,52);}},
  {k:'notes',nm:'Sticky notes',ct:String(notes.length),th:c=>{c.fillStyle='#fff';c.fillRect(0,0,68,52);c.fillStyle=C.note;c.fillRect(22,12,24,24);}},
  {k:'bg',nm:'Background',ct:'locked',th:c=>{c.drawImage(bgC,0,0,68,52);}}];
  layersEl.innerHTML='';rows.forEach(r=>{const li=document.createElement('li');if((r.k==='paint'&&['brush','spray','marker','eraser'].includes(tool))||(r.k==='notes'&&(tool==='note'||tool==='move')))li.className='cur';
    li.innerHTML=`<button class="eye" aria-pressed="${vis[r.k]}" aria-label="Show or hide ${r.nm}">${vis[r.k]?eye:eyeOff}</button><span class="th"><canvas width="68" height="52"></canvas></span><span class="nm">${r.nm}</span><span class="ct">${r.ct}</span>`;
    r.th(li.querySelector('canvas').getContext('2d'));li.querySelector('.eye').addEventListener('click',()=>toggleVis(r.k));layersEl.appendChild(li);});}
function toggleVis(k){vis[k]=!vis[k];({bg:bgC,notes:stkLayer,paint:paintC})[k].style.visibility=vis[k]?'':'hidden';renderLayers();}
renderLayers();

/* menus */
const menus=[...ps.querySelectorAll('.menu')];
function closeMenus(){menus.forEach(m=>{m.querySelector('ul').hidden=true;m.firstElementChild.setAttribute('aria-expanded','false');});}
menus.forEach(m=>{const b=m.firstElementChild,ul=m.querySelector('ul');b.addEventListener('click',e=>{e.stopPropagation();const open=ul.hidden;closeMenus();ul.hidden=!open;b.setAttribute('aria-expanded',open);if(open){const f=ul.querySelector('button');f&&f.focus();}});});
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeMenus();});
ps.addEventListener('click',e=>{const b=e.target.closest('.menu li button');if(!b)return;closeMenus();
  if(b.dataset.bg){setBg(b.dataset.bg);return;}if(b.dataset.act==='pickbg'){bgPick.click();return;}
  ({new:()=>{strokes=[];notes.forEach(n=>n.el.remove());notes=[];selNote=null;redrawPaint();toast('New wall');},save:exportPng,undo,clearpaint:()=>{strokes=[];redrawPaint();toast('Paint layer cleared');},
    addnote:()=>{addNote();setTool('move');toast('Note added');},delnote:delNote,togglebg:()=>toggleVis('bg')})[b.dataset.act]?.();});
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;const k=e.key.toLowerCase(),r=board.getBoundingClientRect(),inView=r.top<innerHeight&&r.bottom>0;if(!inView)return;
  if((e.metaKey||e.ctrlKey)&&k==='z'){e.preventDefault();undo();return;}if((e.metaKey||e.ctrlKey)&&k==='s'){e.preventDefault();exportPng();return;}if(e.metaKey||e.ctrlKey)return;
  const t={v:'move',b:'brush',s:'spray',m:'marker',e:'eraser',n:'note'}[k];if(t){setTool(t);return;}
  if((k==='backspace'||k==='delete')&&selNote){e.preventDefault();delNote();}if(k==='escape'){if(!viewer.hidden)closeViewer();closeMenus();}
  if(k==='['){sizeIn.value=Math.max(2,size-4);sizeIn.dispatchEvent(new Event('input'));}if(k===']'){sizeIn.value=Math.min(120,size+4);sizeIn.dispatchEvent(new Event('input'));}});

/* export: background + notes + paint at 1080 × 1350 */
function compose(){const out=document.createElement('canvas');out.width=OUT_W;out.height=OUT_H;const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,OUT_W,OUT_H);if(vis.bg)o.drawImage(bgC,0,0);
  if(vis.notes)notes.forEach(n=>{o.save();o.translate(n.x+NOTE_W/2,n.y+NOTE_W/2);o.rotate(n.rot*Math.PI/180);o.shadowColor='rgba(20,21,22,.3)';o.shadowBlur=18;o.shadowOffsetY=8;o.drawImage(n.cv,-NOTE_W/2,-NOTE_W/2,NOTE_W,NOTE_W);o.restore();});
  if(vis.paint)o.drawImage(paintC,0,0);o.font='500 22px "JetBrains Mono", monospace';o.fillStyle='rgba(20,21,22,.5)';o.textAlign='right';o.fillText('aoost · the wall',OUT_W-28,OUT_H-28);return out;}
const saveBtn=document.getElementById('save');let downloads=null;
if(IN_CLAUDE&&window.claude.use){window.claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});}
function exportPng(){const name=`aoost-wall-${new Date().toISOString().slice(0,10)}.png`;
  compose().toBlob(async blob=>{if(!blob){toast('Could not make the image. Try again');return;}
    if(IN_CLAUDE){if(!downloads){toast('Export is not available in this view');return;}
      try{await downloads.save({filename:name,data:blob});toast('Exported '+name);}catch(err){toast(err&&err.code==='declined'?'Export cancelled':err&&err.code==='rate_limited'?'One moment, then try again':'Export is not available here');}return;}
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Exported '+name);},'image/png');}
saveBtn.addEventListener('click',exportPng);
})();
</script>
